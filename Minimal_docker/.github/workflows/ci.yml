name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/package_skill.py --check
      - run: python -m unittest discover -s tests -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/inspect_image.sh tests/smoke/run.sh

  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: bash tests/smoke/run.sh

  package:
    needs: [unit, shellcheck, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/package_skill.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-docker-skill
          path: dist/minimal-docker.skill
      - name: Check tag matches SKILL.md version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^  version: "\(.*\)"$/\1/p' SKILL.md)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match SKILL.md version $version" >&2
            exit 1
          fi
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/minimal-docker.skill --title "$GITHUB_REF_NAME" --generate-notes
